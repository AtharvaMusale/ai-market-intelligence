# Dark, near-black theme matching atharvamusale.github.io. The rest of the styling is in app/theme.py.
[theme]
base = "dark"
primaryColor = "#ededed"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
textColor = "#ededed"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
